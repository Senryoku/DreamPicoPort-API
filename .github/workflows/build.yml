name: Build Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-windows-gnu
            os: windows-latest
            extra_cmake_args: ""
          - target: x86_64-linux-gnu
            os: ubuntu-latest
            extra_cmake_args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libudev-dev

      - name: Configure CMake
        run: >
          cmake 
          -DTARGET=${{ matrix.target }} 
          -DCMAKE_TOOLCHAIN_FILE="zig-toolchain.cmake" 
          -DCMAKE_BUILD_TYPE=Release 
          ${{ matrix.extra_cmake_args }} 
          -G Ninja 
          -B ./build

      - name: Build Project
        run: cmake --build ./build --config Release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libdream_pico_port-${{ matrix.target }}
          path: |
            build/ext/libusb-cmake/libusb-1.0.a
            build/ext/src/libdream_pico_port_api.a